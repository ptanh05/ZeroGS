[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerogs"
version = "1.0.0"
authors = [
  { name="Phung The Anh", email="theanh.research@example.com" },
]
description = "Zero-OOM: Byte-Level Transient Memory Modeling and Occlusion-Aware Admission Control for 3D Gaussian Splatting"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
